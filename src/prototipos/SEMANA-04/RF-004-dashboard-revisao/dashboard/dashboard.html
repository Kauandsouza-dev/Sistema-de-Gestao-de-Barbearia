<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BarberFlow - Agendamentos</title>
    <link rel="stylesheet" href="dashboard.css">
</head>

<body>

    <header class="topo">
        <div class="cabecalho">
            <!-- Imagem otimizada em formato WebP -->
            <img src="../assets/icone_barbearia.webp" alt="Ícone da Barbearia BarberFlow" class="icone_barbearia">
            <h1>BARBERFLOW</h1>
        </div>
        <!-- Sintaxe corrigida com aspas no onclick -->
        <button class="btn_sair" onclick="sair()">Sair</button>
    </header>

    <main class="conteudo">

        <div class="linha_titulo">
            <h2>Agendamentos</h2>
            <button id="botaoNovo" class="btn_acao" onclick="abrirFormularioNovo()">+ Novo Agendamento</button>
        </div>

        <div class="cartao">

            <!-- Acessibilidade: aria-label para leitor de tela no campo de busca -->
            <label for="busca" class="sr-only" style="display: none;">Buscar por cliente:</label>
            <input class="input campo_busca" type="text" id="busca" placeholder="Buscar por cliente"
                aria-label="Buscar por cliente" onkeyup="mostrarAgendamentos()">

            <table id="tabela">
                <!-- Semântica WCAG: thead e scope="col" nos cabeçalhos -->
                <thead>
                    <tr>
                        <th scope="col">Cliente</th>
                        <th scope="col">Serviço</th>
                        <th scope="col">Barbeiro</th>
                        <th scope="col">Data</th>
                        <th scope="col">Hora</th>
                        <th scope="col">Status</th>
                        <th scope="col">Ações</th>
                    </tr>
                </thead>
                <tbody id="corpoTabela">
                    <!-- Linhas carregadas via JS -->
                </tbody>
            </table>

            <p id="mensagemVazia">Nenhum agendamento encontrado.</p>

        </div>

        <!-- Formulário com vincultos de label (for) e id (WCAG 2.1) -->
        <div id="caixaFormulario" class="cartao caixa_formulario" style="display: none;">

            <h3 id="tituloFormulario">Novo Agendamento</h3>

            <label for="campoCliente">Cliente:</label>
            <input class="input" type="text" id="campoCliente" placeholder="Nome do cliente">

            <label for="campoServico">Serviço:</label>
            <select class="input" id="campoServico">
                <option value="Corte Masculino">Corte Masculino</option>
                <option value="Barba">Barba</option>
                <option value="Corte + Barba">Corte + Barba</option>
                <option value="Sobrancelha">Sobrancelha</option>
            </select>

            <label for="campoBarbeiro">Barbeiro:</label>
            <input class="input" type="text" id="campoBarbeiro" placeholder="Nome do barbeiro">

            <label for="campoData">Data:</label>
            <input class="input" type="date" id="campoData">

            <label for="campoHora">Hora:</label>
            <input class="input" type="time" id="campoHora">

            <label for="campoStatus">Status:</label>
            <select class="input" id="campoStatus">
                <option value="Confirmado">Confirmado</option>
                <option value="Pendente">Pendente</option>
                <option value="Cancelado">Cancelado</option>
            </select>

            <div class="linha_botoes">
                <button class="btn_acao" onclick="salvarAgendamento()">Salvar</button>
                <button class="btn_cancelar" onclick="fecharFormulario()">Cancelar</button>
            </div>

        </div>

    </main>

    <script src="dashboard.js"></script>
</body>

</html>
