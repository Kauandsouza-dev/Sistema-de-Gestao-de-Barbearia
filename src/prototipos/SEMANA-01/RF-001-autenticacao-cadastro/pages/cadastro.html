<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BarberFlow</title>
    <link rel="stylesheet" href="../styles/cadastro.css">
    <link rel="icon" type="image/png" href="../assets/icone_barbearia.jpg">
</head>

<body>
    <main class="conteudo__pagina__texto">
        </section>
        <form class="login">
            <img src="../assets/icone_barbearia.jpg" alt="Ícone da Barbearia" class="icone__barbearia">
            <h1>BarberFlow</h1>
            <p>Crie sua Conta</p>
            <label for="email">E-mail</label>
            <input class="input" id="email" name="email" type="email" placeholder="seu@email.com" autocomplete="email"
                required>
            <button class="btn__avancar" type="button" onclick="validarEmail()"> Avançar </button>
        </form>
    </main>
</body>
<script>
    function validarEmail() {
        var email = document.getElementById("email").value;
        var formatoValido = email.includes("@") && email.includes(".");
        if (email === "") {
            alert("Por favor, preencha o e-mail.");
            return;
        }
        if (!formatoValido) {
            alert("Por favor, insira um e-mail válido.");
            return;
        }
        window.location.href = "cadastro_senha.html";
    }
</script>

</html>
