<!DOCTYPE html>
<html lang="pt-br">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bar Bearia</title>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="icon" type="image/png" href="assets/icone_barbearia.jpg">
</head>

<body>
    <section class="conteudo__pagina__texto">
        <div class="textos">
            <div class="cabecalho">
                <img src="assets/icone_barbearia.jpg" alt="Icone da Barbearia" class="icone__barbearia">
                <h2 style="padding-bottom: 5%;">Bar Bearia</h2>
            </div>
            <h1>Você faz tudo pelo <br>seu negócio. <br>O Mostralo também!</h1>
            <h3 style="padding-top: 10%;">Faz tudo para o seu negócio crescer</h3>
        </div>

        <div class="login">
            <h1>Portal de Acesso</h1>
            <label style="align-self: flex-start;">E-mail</label>
            <input class="input" type="text" placeholder="seu@email.com">
            <label style="align-self: flex-start;">Senha</label>
            <input class="input" type="password" placeholder="Sua senha">
            <a class="link" href="#" style="padding-top: 0.7rem; padding-bottom: 0.7rem;">Esqueci minha senha</a>
            <button class="btn__entrar" href="#">Entrar</button>
            <a class="link" href="#" style="padding-top: 0.7rem;">Não tem uma conta? Crie aqui!</a>
        </div>
    </section>
</body>

</html>
